<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C'est la NBA bébé</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#EFE3CC;--card:#FBF6EC;--ink:#1B2A49;--mute:#6B6657;--red:#C8372D;--line:#D9C9A8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141B2D;--card:#1E2842;--ink:#F3EBDA;--mute:#A9A28E;--red:#F0604F;--line:#34405F}}
:root[data-theme="dark"]{--bg:#141B2D;--card:#1E2842;--ink:#F3EBDA;--mute:#A9A28E;--red:#F0604F;--line:#34405F}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:12px 12px 90px}
h1{font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 10px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
nav button{flex:1;padding:12px 4px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:12px;font:700 18px "Barlow Condensed",sans-serif}
nav button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card.g{border:2px solid var(--red)}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hd b{font:700 22px "Barlow Condensed",sans-serif}
.tag{background:var(--red);color:#fff;font:700 13px "Barlow Condensed",sans-serif;padding:2px 8px;border-radius:999px}
.t{color:var(--mute);font-size:14px;margin:2px 0 8px}
.r{display:flex;gap:6px;align-items:center;margin-top:6px}
input:not([type=checkbox]),select{width:100%;min-width:0;padding:9px;border:2px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:500 15px Barlow,sans-serif}
.r select{flex:2}.r input[type=number]{flex:1;min-width:84px}
.ot{display:flex;align-items:center;gap:4px;font-size:14px;white-space:nowrap}
button.b{padding:11px;border:0;border-radius:10px;background:var(--red);color:#fff;font:700 17px "Barlow Condensed",sans-serif;width:100%;margin-top:8px}
button.s{padding:8px 10px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:9px;font:600 14px Barlow,sans-serif}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{padding:5px 3px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
.lock{color:var(--mute);font-size:13px;margin-top:6px}
.lb{font-size:13px;color:var(--mute);margin:8px 0 3px}
.err{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;padding:8px 10px;border-radius:10px;margin-bottom:10px;font-size:14px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pick button{flex:1 1 40%;padding:16px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:12px;font:700 24px "Barlow Condensed",sans-serif}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
:root:root:root{--bg:#E9EDF4;--card:#fff;--ink:#0B1F3F;--mute:#55627A;--red:#C8102E;--line:#D5DBE6}
main{padding-top:0}
h1{background:#0B1F3F;color:#fff;margin:0 -12px;padding:18px 14px 6px;font-size:28px;text-transform:uppercase;letter-spacing:.04em}
h1+.sub{background:#0B1F3F;color:#C9D3E6;margin:0 -12px 12px;padding:0 14px 12px;border-bottom:6px solid #C8102E;font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.card{border:0;border-radius:10px;padding:10px;margin-bottom:10px}
.card.g{border:2px solid #FDB927}
.card>.hd:first-child{background:#0B1F3F;color:#fff;margin:-10px -10px 8px;padding:6px 10px;border-radius:8px 8px 0 0;align-items:center}
.hd b{font-size:19px;text-transform:uppercase}
.hd .s{color:#fff;border-color:#fff}
.tag{background:#FDB927;color:#0B1F3F}
.t{margin:0 0 6px;font-size:13px}
.r{margin-top:4px}
input:not([type=checkbox]),select{padding:6px 8px;font-size:14px;border-radius:8px}
.r input[type=number]{min-width:72px}
.lock{font-size:12px;margin-top:4px}
th{color:var(--mute);font-weight:600}
nav{background:#0B1F3F;border-top:0;gap:0;padding:0 0 env(safe-area-inset-bottom,0px)}
nav button{border:0;border-top:4px solid transparent;border-radius:0;background:transparent;color:#C9D3E6;padding:12px 4px;text-transform:uppercase;letter-spacing:.04em}
nav button[aria-pressed=true]{background:transparent;color:#fff;border-top-color:#C8102E}
.ok{position:sticky;top:0;z-index:5;background:#007A33;color:#fff;padding:8px 10px;border-radius:10px;margin-bottom:10px;font-size:14px}
.nsel{background:#0B1F3F;border-radius:10px;padding:6px 10px;margin-bottom:10px;display:flex;align-items:center;gap:10px;color:#fff}
.nsel span{font:700 15px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.nsel select{flex:1;font:700 15px/1.3 'Barlow Condensed',sans-serif;padding:6px 8px;border:2px solid #FDB927;background:#fff;color:#0B1F3F;border-radius:8px}
.rec td:nth-child(2){text-align:left}
tr.cat th{background:#0B1F3F;color:#fff;text-align:left;padding:6px 8px;font:700 15px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em}
tr.cat small{font:500 12px Barlow,sans-serif;text-transform:none;opacity:.9}
.cpy{width:100%;height:110px;box-sizing:border-box;border:2px solid var(--line);border-radius:8px;padding:6px;font-size:13px;background:var(--bg);color:var(--ink)}
</style>
</head>
<body>
<main id="root"><p class="sub">Chargement…</p></main>
<script>
const PL=['Igor','Antho','Bats','Gui'];
function mp(x,PL){
 const out={},rk={};PL.forEach(p=>out[p]=0);
 const sg=(w,m)=>(w==='A'?1:-1)*m;
 PL.forEach(p=>{const k=x.k[p];if(k.w&&k.m!==''){rk[p]={ok:k.w===x.r.w,d:Math.abs(sg(k.w,k.m)-sg(x.r.w,x.r.m))}}});
 const ns=Object.keys(rk),val=p=>(rk[p].ok?0:1000)+rk[p].d,vs=ns.map(val);
 const mx=Math.max(...vs),same=new Set(vs).size<2;
 const gd=ns.filter(p=>rk[p].ok),mg=Math.min(...gd.map(p=>rk[p].d)),ex=gd.some(p=>rk[p].d===0);
 ns.forEach(p=>{const q=rk[p];if(q.ok&&q.d===0){out[p]+=5;return}
  let s=q.ok?1:-1;if(q.ok&&!ex&&q.d===mg)s++;if(val(p)===mx&&!same)s--;out[p]+=s});
 const bad=PL.filter(p=>x.k[p].ot&&!x.r.ot);
 PL.forEach(p=>{if(x.k[p].ot){if(x.r.ot)out[p]+=5;else{out[p]-=1;if(bad.length===1&&ns.every(q=>rk[q].ok))out[p]-=1}}});
 return out}
function sc(top,pk){const o={},n=s=>String(s||'').trim().toLowerCase();PL.forEach(p=>o[p]=0);const pi=PL.filter(p=>n(pk[p].name)),f=pi.filter(p=>n(top.name)&&(n(pk[p].name)===n(top.name)||(top.al||[]).some(a=>n(a)===n(pk[p].name))));if(f.length)f.forEach(p=>o[p]+=3);else if(pi.length){const b=Math.max(...pi.map(p=>+pk[p].pts||0));pi.filter(p=>b>=20&&(+pk[p].pts||0)===b).forEach(p=>o[p]+=1)}pi.forEach(p=>{if(pk[p].pts!==''&&pk[p].pts!=null&&+pk[p].pts<20)o[p]-=3});return o}
function nbn(M){const o={};PL.forEach(p=>o[p]=0);if(M.length<2)return o;PL.forEach(p=>{const l=M.filter(x=>x.k[p].w&&x.k[p].m!=='');if(l.length!==M.length)return;const g=l.filter(x=>x.k[p].w===x.r.w).length;if(g===l.length)o[p]=5;else if(g===0)o[p]=-5});return o}
const SC=['MVP','MIP','ROY','DPOY','COY','6MOY','Champion NBA'];
const t0=()=>G.length?Math.min(...G.map(g=>g.t)):Infinity;
const nT0=n=>{const a=G.filter(g=>g.night===n).map(g=>g.t);return a.length?Math.min(...a):Infinity};
const isSun=n=>!!n&&new Date(n+'T12:00:00Z').getUTCDay()===0;
function mine(){return K[ME.uid]||{name:ME.name,p:{}}}
const fd=n=>String(n||'').split('-').reverse().join('/');
const nrm=s=>String(s||'').trim().toLowerCase(),dOf=p=>Object.values(K).find(x=>x.name===p),OPP=()=>PL.filter(p=>p!==ME.name);
const hit=(n,d)=>Object.values(K).some(x=>x.name!==n&&x.dr&&!Array.isArray(x.dr)&&x.dr[n]===d);
const tm=()=>[...new Set(Object.values(K).flatMap(x=>Object.values(x.wt||{})).filter(Boolean))];
function sunPts(g){const o={},b=g.bs||{};PL.forEach(p=>o[p]=0);if(!b.name)return o;PL.forEach(p=>{const d=dOf(p),m=d&&d.ms&&d.ms[g.id];if(!nrm(m))return;if(nrm(m)===nrm(b.name)||(b.al||[]).some(a=>nrm(a)===nrm(m)))o[p]+=2;const v=b.pp&&b.pp[p];if(v!=null&&+v<20)o[p]-=2});return o}
function sunTbl(g){const b=g.bs||{};return `<table><tr><th></th><th>Marqueur</th></tr>${PL.map(n=>{const d=dOf(n),m=d&&d.ms&&d.ms[g.id]||'—';return `<tr><td>${n}</td><td>${e(m)}${b.pp&&b.pp[n]!=null?' ('+b.pp[n]+' pts)':''}</td></tr>`}).join('')}</table>${b.name?`<div class="t">Meilleur marqueur du match : <b>${e(b.name)} (${b.pts})</b></div>`:''}`}
function sunAdm(g){if(!isSun(g.night))return '';const b=g.bs||{},pp=b.pp||{};return `<div class="lb">Meilleur marqueur du match</div><div class="r"><input id="bn${g.id}" placeholder="Nom" value="${e(b.name||'')}"><input type="number" inputmode="numeric" id="bp${g.id}" placeholder="pts" value="${b.pts??''}"></div><div class="lb">Autres orthographes acceptées</div><div class="r"><input id="bl${g.id}" value="${e((b.al||[]).join(', '))}"></div>${PL.map(p=>`<div class="lb">Points du choix de ${p}</div><div class="r"><input type="number" inputmode="numeric" id="bq${g.id}${p}" value="${pp[p]??''}"></div>`).join('')}`}
function WINS(o){if(!SE||!SE.w)return;PL.forEach(q=>PL.forEach(p=>{if(p===q)return;const dp=dOf(p),dq=dOf(q),t=dp&&dp.wt&&dp.wt[q],w=SE.w[t],g=dq&&dq.wg&&dq.wg[p];if(t&&w!=null&&g!==''&&g!=null)o[q]+=5-Math.abs(+g-w)}))}
function vdev(){const L=Date.now()>=t0(),R=[];
 PL.forEach(p=>PL.forEach(q=>{if(p===q)return;const dp=dOf(p),dq=dOf(q),t=dp&&dp.wt&&dp.wt[q]||'',g=dq&&dq.wg&&dq.wg[p],mine=ME.name===p||ME.name===q;
  if(!L&&!mine)return;if(!t&&(g==null||g===''))return;
  const show=L||ME.name===q,w=SE&&SE.w&&t?SE.w[t]:undefined,has=g!=null&&g!=='';
  R.push(`<tr><td>${e(t||'—')}</td><td>${p}</td><td>${q}</td><td>${show?(has?g:'—'):'🔒'}</td><td>${w!=null?w:'—'}</td><td>${show&&has&&w!=null?5-Math.abs(+g-w):'—'}</td></tr>`)}));
 return `<div class="card"><b>Récap des devinettes</b><div class="t">${L?'Toutes les devinettes de victoires.':'Avant le début de la saison, tu ne vois que les lignes qui te concernent. Les devinettes des autres restent cachées.'}</div>${R.length?`<table><tr><th>Équipe</th><th>Choisie par</th><th>Pour</th><th>Devine</th><th>Réel</th><th>Pts</th></tr>${R.join('')}</table>`:'<div class="t">Rien pour l\'instant.</div>'}</div>`}
function vuse(){const now=Date.now(),lim=n=>Number.isFinite(nT0(n))?nT0(n):new Date(n+'T00:00:00Z').getTime();
 const f=a=>{const j=a.filter(n=>now>=lim(n)).length;return a.length+'/3'+(j?' ('+j+' jouée'+(j>1?'s':'')+')':'')};
 const row=p=>{const d=K[p],dr=d&&d.dr&&!Array.isArray(d.dr)?Object.values(d.dr).filter(Boolean):[],du=d&&d.du&&!Array.isArray(d.du)?Object.values(d.du).filter(Boolean):[];return `<tr><td>${p}</td><td>${f(dr)}</td><td>${f(du)}</td></tr>`};
 return `<div class="card"><b>Récap : patates et défis</b><div class="t">Utilisés sur 3 par joueur. Entre parenthèses : déjà joués.</div><table><tr><th></th><th>Patates</th><th>Trash Talk</th></tr>${PL.map(row).join('')}</table></div>`}
function vpat(){const my=mine();let h='';
  h+=`<div class="card"><b>Patate de Draymond</b><div class="t">Une nuit par adversaire (3 par saison) : ses points de la nuit sont annulés. À annoncer avant le premier match de la nuit (date de la journée américaine).</div>`+OPP().map(q=>`<div class="lb">Pour ${q}</div><div class="r"><input type="date" data-dr="${q}" value="${e((!Array.isArray(my.dr)&&my.dr||{})[q]||'')}"></div>`).join('')+'<button class="b" data-sv="1">Enregistrer</button></div>';
 return h}
function vb(){
 const my=mine(),L=Date.now()>=t0();
 let h=`<div class="card"><b>Pronostic de victoires</b><div class="t">Choisis une équipe pour chaque adversaire : il devra deviner son nombre de victoires. +5 si pile, puis −1 par victoire d'écart.</div>`;
 h+=OPP().map(q=>`<div class="lb">Équipe pour ${q}</div><div class="r"><input data-wt="${q}" placeholder="ex. BOS" value="${e((my.wt||{})[q]||'')}" ${L?'disabled':''}></div>`).join('');
 h+=`<div class="lb"><b>Mes devinettes</b></div>`+OPP().map(p=>{const d=dOf(p),t=d&&d.wt&&d.wt[ME.name];return `<div class="lb">Victoires de ${t?e(t):'(équipe pas encore choisie)'} · choisie par ${p}</div><div class="r"><input type="number" inputmode="numeric" data-wg="${p}" value="${(my.wg||{})[p]??''}" ${L||!t?'disabled':''}></div>`}).join('')+(L?'':'<button class="b" data-sv="1">Enregistrer</button>')+'</div>';
 return h}
function vw(){const T=tm();if(!T.length)return '';return `<div class="card"><b>Victoires réelles des équipes</b>${T.map(t=>`<div class="lb">${e(t)}</div><div class="r"><input type="number" inputmode="numeric" id="sw${t}" value="${((SE||{}).w||{})[t]??''}"></div>`).join('')}<button class="b" id="sawn">Enregistrer les victoires</button></div>`}
function savePatch(patch){return DB.doc('picks/'+ME.uid).set(Object.assign({},mine(),patch))}
function npk(n){const o={};PL.forEach(p=>{const d=Object.values(K).find(x=>x.name===p),a=d&&d.np&&d.np[n]||'';o[p]={name:a,pts:(NS[n]&&NS[n].pp&&NS[n].pp[p])??''}});return o}
function nsp(n){const q={},b={};PL.forEach(p=>{q[p]=0;b[p]=0});const gs=G.filter(g=>g.night===n);if(!isSun(n)&&NS[n]&&NS[n].top&&NS[n].top.name){const x=sc(NS[n].top,npk(n));PL.forEach(p=>q[p]+=x[p])}if(gs.length&&gs.every(g=>g.r)){const x=nbn(gs.map(g=>({r:g.r,k:Object.fromEntries(PL.map(p=>[p,kp(p,g)]))})));PL.forEach(p=>b[p]+=x[p])}return{q,b}}
function nsc(n){const o={};PL.forEach(p=>o[p]=0);const gs=G.filter(g=>g.night===n);
 if(!isSun(n)&&NS[n]&&NS[n].top&&NS[n].top.name){const s=sc(NS[n].top,npk(n));PL.forEach(p=>o[p]+=s[p])}
 if(gs.length&&gs.every(g=>g.r)){const b=nbn(gs.map(g=>({r:g.r,k:Object.fromEntries(PL.map(p=>[p,kp(p,g)]))})));PL.forEach(p=>o[p]+=b[p])}
 return o}
function sp(){const o={};PL.forEach(p=>o[p]=0);const n=s=>String(s||'').trim().toLowerCase();PL.forEach(p=>{const d=Object.values(K).find(x=>x.name===p);SC.forEach(c=>{if(SE&&SE[c]&&d&&d.s&&n(d.s[c])===n(SE[c]))o[p]+=10})});WINS(o);return o}
const $=id=>document.getElementById(id),e=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let EXP=null,LG=null,NS={},SE={},CF=null,DB=null,ME={uid:null,name:null,owner:false},G=[],K={},tab='p',night=null,err='',ready=false;
const fr=(t,o)=>new Date(t).toLocaleString('fr-FR',Object.assign({timeZone:'Europe/Paris'},o));
const lab=(g,w)=>w==='A'?g.a:g.b;
const nights=()=>[...new Set(G.map(g=>g.night))].sort();
const locked=g=>Date.now()>=g.t;
function defNight(){const ns=nights();if(!ns.length)return null;const up=G.filter(g=>!locked(g)).sort((a,b)=>a.t-b.t)[0];return up?up.night:ns[ns.length-1]}
function kp(name,g){const d=Object.values(K).find(x=>x.name===name),q=d&&d.p&&d.p[g.id];return q?{w:q.ot?'':(q.w||''),m:q.ot||q.m==null||q.m===''?'':+q.m,ot:!!q.ot}:{w:'',m:'',ot:false}}
function gp(g,w){if(!g.r)return null;const k={};PL.forEach(n=>k[n]=kp(n,g));const o=mp({r:g.r,k},PL),f=g.gotn?2:1;PL.forEach(n=>o[n]*=f);if(isSun(g.night)){const q=sunPts(g);PL.forEach(n=>{if(w==='m')return;if(w==='s')o[n]=q[n]*f;else o[n]+=q[n]*f})}else if(w==='s')PL.forEach(n=>o[n]=0);return o}
function fmt(g,q){if(!q||(!q.w&&!q.ot))return '—';return (q.w?lab(g,q.w)+(q.m!==''?' +'+q.m:''):'')+(q.ot?(q.w?' ':'')+'OT':'')}
function render(){
 if(!ready)return;
 const my=ME.uid&&K[ME.uid];ME.name=my&&my.name||null;ME.owner=ME.name==='Igor';
 let h=(err?`<div class="err">${e(err)}</div>`:'')+(EXP?expCard():'')+(OKM?`<div class="ok">${e(OKM)}</div>`:'')+`<h1>C'est la NBA bébé</h1><p class="sub">${ME.name?'Salut '+e(ME.name):'Bienvenue'}</p>`;
 if(!ME.name){
  if(LG){const d0=K[LG],nw=!(d0&&d0.name);h+=`<div class="card"><b>${LG}</b><p class="sub">${nw?'Première fois : choisis un code à 4 chiffres et retiens-le.':'Entre ton code à 4 chiffres.'}</p><div class="r"><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="Code" autocomplete="off"></div><button class="b" id="lgok">Valider</button><button class="b" id="lgx" style="background:#0B1F3F">Retour</button></div>`}
  else h+=`<div class="card"><b>Qui es-tu ?</b><p class="sub">Choisis ton nom.</p><div class="pick">${PL.map(n=>`<button data-claim="${n}">${n}${K[n]&&K[n].name?'':' (libre)'}</button>`).join('')}</div></div>`;
 }else h+=tab==='p'?vp():tab==='c'?vc():tab==='s'?vpat()+duelUI()+vuse()+vs()+vb()+vdev():vi()+vcopy()+va()+vz()+vw();
 h+='<p class="sub" style="text-align:center">Version 2.8 · 21/10/2026</p>';h+=`<nav><button data-tab="p" aria-pressed="${tab==='p'}">Pronos</button><button data-tab="c" aria-pressed="${tab==='c'}">Classement</button><button data-tab="s" aria-pressed="${tab==='s'}">Saison</button>${ME.owner?`<button data-tab="a" aria-pressed="${tab==='a'}">Admin</button>`:''}</nav>`;
 $('root').innerHTML=h}
function nsel(){const ns=nights();if(!ns.length)return '';if(!night||!ns.includes(night))night=defNight();return `<div class="nsel"><span>Nuit du</span><select id="ns" aria-label="Nuit">${ns.map(n=>`<option value="${n}" ${n===night?'selected':''}>${fd(n)}</option>`).join('')}</select></div>`}
function vp(){
 if(!G.length)return `<div class="card">Aucun match pour l'instant.${ME.owner?' Ajoute-les dans l\'onglet Admin.':''}</div>`;
 let h=nsel();
 G.filter(g=>g.night===night).sort((a,b)=>a.t-b.t).forEach(g=>{
